<script>
/* 小齿轮点击弹出 */
document.getElementById('settingsBtn').addEventListener('click',function(e){
  e.stopPropagation();

});
document.addEventListener('click',function(){document.getElementById('settingsPop').classList.remove('show')});
document.getElementById('settingsPop').addEventListener('click',function(e){e.stopPropagation()});

var FAAS_URL='https://faasapi.ihr360.com/public/api/function/execute/v1/1115221717908856832/version/latest';
var FAAS_KEY='41WpwVeCGVEo2gdlbLi3pX7ewAwA9q52IuhWuxzs';
document.getElementById('faasFetchBtn').addEventListener('click',async function(){
  var btn=document.getElementById('faasFetchBtn'),st=document.getElementById('loadStatus');
  btn.disabled=1;btn.textContent='拉取中...';st.textContent='正在调用后端...';st.style.color='var(--neutral-500)';
  try{
    var r=await fetch(FAAS_URL,{method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'application/json','Api-Key':FAAS_KEY},body:JSON.stringify({input:{}})});
    var t=await r.text();if(!r.ok)throw Error('HTTP '+r.status);
    var d=JSON.parse(t);
    if(d&&d.data&&typeof d.data==='object'&&'code'in d.data)d=d.data;
    loadData(d);
  }catch(e){st.textContent='拉取失败: '+e.message.substring(0,100);st.style.color='var(--red-500)';console.error(e)}
  finally{btn.disabled=0;btn.textContent='一键拉取台账'}
});
function loadData(data){
  var s=data&&data.data||{};var f=s.files||[];var p=s.processes;
  if(!p||!p.length){document.getElementById('loadStatus').textContent='未找到流程数据';return}
  p.forEach(function(x){if(!x.formFields)x.formFields={};if(!x.files)x.files=[]});
  window.allRawFiles=f;window.formFieldsByTemplate=s.formFieldsByTemplate||{};
  allProcesses=p;selectedKeys={};filteredProcs=[];
  populateTemplateFilter(p);
  rebuildHeader(document.getElementById('templateFilter').value);
  document.getElementById('statProcess').textContent=p.length;
  document.getElementById('statFiles').textContent=f.length;
  document.getElementById('statAttach').textContent=s.attachCount||f.filter(function(x){return x.fileType==='attach'}).length;
  document.getElementById('statImage').textContent=s.imageCount||f.filter(function(x){return x.fileType==='image'}).length;
  document.getElementById('statsRow').style.display='grid';
  document.getElementById('batchHint').style.display='block';
  applyFilter();document.getElementById('filterBar').style.display='flex';document.getElementById('exportBtn').disabled=0;
  document.getElementById('batchBar').style.display='flex';
  document.getElementById('sourceLabel').innerHTML='<span class="status-dot live"></span>已加载 '+p.length+' 个流程';
  document.getElementById('loadStatus').textContent='✓ 成功加载 '+p.length+' 个流程';
  updateBatchUI();
}

/* ---- 列配置 ---- */
var COLUMNS=[
  {key:'processCode',label:'审批编号',defShow:1},
  {key:'templateName',label:'审批名称',defShow:1},
  {key:'applicantName',label:'发起人',defShow:1},
  {key:'createTime',label:'发起时间',defShow:1},
  {key:'title',label:'审批摘要',defShow:1},
  {key:'files',label:'文件',defShow:1}
];
function loadColumnVis(){
  var saved;try{saved=JSON.parse(localStorage.getItem('procColVis'))}catch(e){}
  window.columnVis=saved||{};
  COLUMNS.forEach(function(c){if(window.columnVis[c.key]===undefined)window.columnVis[c.key]=c.defShow});
}
function saveColumnVis(){
  try{localStorage.setItem('procColVis',JSON.stringify(window.columnVis))}catch(e){}
  buildSettingsPop();rebuildHeader(document.getElementById('templateFilter').value);applyFilter();
}
function isColVis(k){
  var v=window.columnVis[k];
  if(v===undefined)return k.indexOf('cf_')!==0?1:0;
  return v!==0;
}
loadColumnVis();

var allProcesses=[],filteredProcs=[],currentPage=1,selectedKeys={};
function procKey(p){return p.processId||p.title}
/* 每页行数，从 localStorage 读取 */
var pageSize=parseInt(localStorage.getItem('procPageSize'))||25;
document.getElementById('pageSizeSelect').value=pageSize;
document.getElementById('pageSizeSelect').addEventListener('change',function(){
  pageSize=parseInt(this.value);
  try{localStorage.setItem('procPageSize',pageSize)}catch(e){}
  currentPage=1;renderPage();
});

/* ---- 小齿轮设置弹窗 ---- */
function buildSettingsPop(){
  var html='<div class="sttl">显示列</div>';
  COLUMNS.forEach(function(c){
    var ch=isColVis(c.key)?'checked':'';
    html+='<label><input type="checkbox" data-col="'+c.key+'" '+ch+'>'+c.label+'</label>';
  });
  /* 自定义字段（当前模板有效） */
  var fks=window.activeFormKeys||[];
  if(fks.length){
    html+='<div class="sttl" style="margin-top:6px;">自定义字段</div>';
    fks.forEach(function(k){
      var ck=window.columnVis['cf_'+k]!==0?'checked':'';
      html+='<label><input type="checkbox" data-col="cf_'+k+'" '+ck+'>'+esc(k)+'</label>';
    });
  }
  document.getElementById('settingsPop').innerHTML=html;
  document.querySelectorAll('#settingsPop input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      window.columnVis[this.getAttribute('data-col')]=this.checked?1:0;
      saveColumnVis();
    });
  });
}

/* ---- 表头重建（按列可见性） ---- */
function rebuildHeader(tpl){
  /* 保存当前列宽 */
  var savedW={};
  document.querySelectorAll('#theadInner th').forEach(function(th,i){savedW[i]=th.style.width});
  var fks=tpl&&window.formFieldsByTemplate&&window.formFieldsByTemplate[tpl]||[];window.activeFormKeys=fks;
  var cols=['cb','#'];

  /* 固定列 */
  COLUMNS.forEach(function(c){if(isColVis(c.key))cols.push(c.key)});
  /* 自定义字段 */
  fks.forEach(function(k){if(isColVis('cf_'+k))cols.push('cf_'+k)});

  var h='<tr><th class="col-cb"><input type="checkbox" id="selectAll" title="全选/取消"></th>';
  var colIdx=1;
  COLUMNS.forEach(function(c){
    if(!isColVis(c.key))return;
    var sw=savedW[colIdx]||'';h+='<th'+(sw?' style="width:'+sw+';max-width:'+sw+'"':'')+'>'+c.label+'</th>';colIdx++;
  });
  fks.forEach(function(k){
    if(!isColVis('cf_'+k))return;
    var sw=savedW[colIdx]||'';h+='<th'+(sw?' style="width:'+sw+';max-width:'+sw+'"':'style="max-width:180px;"')+'>'+esc(k)+'</th>';colIdx++;
  });
  h+='</tr>';
  document.getElementById('theadInner').innerHTML=h;
  window.colsTemplate=cols;
  var ec=document.getElementById('emptyStateCell');if(ec)ec.colSpan=cols.length;
  buildSettingsPop();initColResize();
}
function applyFilter(){
  var se=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  var ap=(document.getElementById('applicantInput').value||'').toLowerCase().trim();
  var pc=(document.getElementById('processCodeInput').value||'').toLowerCase().trim();
  var tv=document.getElementById('typeFilter').value;
  var tpv=document.getElementById('templateFilter').value;
  var ts=(document.getElementById('templateSearch').value||'').toLowerCase().trim();
  var df=document.getElementById('dateFrom').value,dt=document.getElementById('dateTo').value;
  filteredProcs=allProcesses.filter(function(p){
    if(se&&!p.title.toLowerCase().includes(se)&&!Object.values(p.formFields||{}).some(function(v){return(v||'').toLowerCase().includes(se)}))return 0;
    if(ap&&!(p.applicantName||'').toLowerCase().includes(ap))return 0;
    if(pc&&!(p.processCode||p.processId||'').toLowerCase().includes(pc))return 0;
    if(tv==='attach'&&!p.hasFile)return 0;
    if(tv==='image'&&!p.files.some(function(f){return f.fileType==='image'}))return 0;
    if(tpv&&p.templateName!==tpv)return 0;
    if(ts&&!(p.templateName||'').toLowerCase().includes(ts))return 0;
    if(df||dt){var d=(p.createTime||'').substring(0,10);if(!d||df&&d<df||dt&&d>dt)return 0}
    return 1;
  });currentPage=1;renderPage();
}
['searchInput','applicantInput','processCodeInput','templateSearch'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){currentPage=1;applyFilter()})});
['dateFrom','dateTo','typeFilter'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){currentPage=1;applyFilter()})});
document.getElementById('templateFilter').addEventListener('change',function(){rebuildHeader(this.value);currentPage=1;applyFilter()});
function renderPage(){
  var n=Math.ceil(filteredProcs.length/pageSize)||1;if(currentPage>n)currentPage=n;
  var start=(currentPage-1)*pageSize,rows=filteredProcs.slice(start,start+pageSize);
  var s=filteredProcs.length===0?0:start+1,e=Math.min(start+pageSize,filteredProcs.length);
  document.getElementById('filterCount').textContent='共 '+filteredProcs.length+' 个流程（显示 '+s+'-'+e+'）';
  var fks=window.activeFormKeys||[];
  /* 构建可见列顺序 */
  function getVisibleCols(){
    var a=[];
    COLUMNS.forEach(function(c){if(isColVis(c.key))a.push(c)});
    fks.forEach(function(k){if(isColVis('cf_'+k))a.push({key:'cf_'+k,label:k,isCustom:1})});
    return a;
  }
  var visibleCols=getVisibleCols(),col=1+visibleCols.length,html='';
  rows.forEach(function(p,i){
    var k=procKey(p),ck=selectedKeys[k]?'checked':'',dt=(p.createTime||'').substring(0,10);
    var cells='';
    visibleCols.forEach(function(c){
      if(c.isCustom)cells+='<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:12px;">'+esc((p.formFields||{})[c.label]||'')+'</td>';
      else if(c.key==='templateName')cells+='<td>'+esc(p.templateName)+'</td>';
      else if(c.key==='applicantName')cells+='<td>'+esc(p.applicantName||'-')+'</td>';
      else if(c.key==='createTime')cells+='<td style="font-size:12px;">'+esc(dt)+'</td>';
      else if(c.key==='title')cells+='<td>'+esc(p.title)+'</td>';
      else if(c.key==='processCode')cells+='<td>'+esc(p.processCode||p.processId||'')+'</td>';
      else if(c.key==='files'){
        var fl='';
        if(p.hasFile&&p.files.length){
          var ls=[];
          p.files.forEach(function(f,j){
            var fn=f.fileName||'文件'+(j+1);
            if(f.officeFileUrl)ls.push('<a href="#" onclick="preview(\''+escapeAttr(f.officeFileUrl)+'\',\''+escapeAttr(fn)+'\');return false;" style="color:var(--blue-500);text-decoration:none;font-size:12px;">'+(j+1)+'.预览</a>');
            else if(f.fileUrl)ls.push('<a href="#" onclick="window.open(\''+escapeAttr(f.fileUrl)+'\',\'_blank\');return false;" style="color:var(--blue-500);text-decoration:none;font-size:12px;">'+(j+1)+'.下载</a>');
          });
          fl='<span style="display:flex;gap:4px;flex-wrap:wrap;">'+ls.join('')+'</span>';
        }else fl='<span style="color:var(--neutral-400);font-size:12px;">无附件</span>';
        cells+='<td>'+fl+'</td>';
      }
    });
    html+='<tr><td class="col-cb"><input type="checkbox" class="file-cb" data-key="'+escAttr(k)+'" '+ck+'></td>'+cells+'</tr>';
  });
  if(!html)html='<tr><td colspan="'+col+'" class="empty-state">无匹配流程</td></tr>';
  document.getElementById('mainBody').innerHTML=html;renderPager(n);
  document.querySelectorAll('.file-cb').forEach(function(cb){
    cb.addEventListener('change',function(){
      if(this.checked)selectedKeys[this.getAttribute('data-key')]=1;else delete selectedKeys[this.getAttribute('data-key')];
      updateBatchUI();
    });
  });
  var sa=document.getElementById('selectAll');
  sa.checked=rows.length>0&&rows.every(function(p){return selectedKeys[procKey(p)]});
  sa.addEventListener('change',function(){
    rows.forEach(function(p){var k=procKey(p);if(sa.checked)selectedKeys[k]=1;else delete selectedKeys[k]});
    document.querySelectorAll('.file-cb').forEach(function(cb){cb.checked=sa.checked});updateBatchUI();
  });
}
function updateBatchUI(){var c=Object.keys(selectedKeys).length;document.getElementById('selCount').textContent=c>0?'已选 '+c+' 个流程':'未选中流程';document.getElementById('batchDlBtn').disabled=c===0}
function renderPager(n){
  if(n<=1){document.getElementById('pager').style.display='none';return}
  document.getElementById('pager').style.display='flex';
  var h='<button '+(currentPage<=1?'disabled':'')+' onclick="currentPage--;renderPage();">上一页</button>';
  for(var p=1;p<=n;p++){
    if(p===1||p===n||Math.abs(p-currentPage)<=2)h+='<button class="'+(p===currentPage?'active':'')+'" onclick="currentPage='+p+';renderPage();">'+p+'</button>';
    else if(h[h.length-1].content!=='…')h+='<span class="page-info">…</span>';
  }
  h+='<button '+(currentPage>=n?'disabled':'')+' onclick="currentPage++;renderPage();">下一页</button><span class="page-info">共 '+n+' 页</span>';
  document.getElementById('pager').innerHTML=h;
}
function populateTemplateFilter(p){
  var t={};p.forEach(function(x){if(x.templateName)t[x.templateName]=1});
  var ks=Object.keys(t).sort(),s=document.getElementById('templateFilter');
  s.innerHTML='<option value="">全部审批模板</option>';
  ks.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o)});
}
/* ---- 表头宽度可拖拽调整 ---- */
function initColResize(){
  document.querySelectorAll('#theadInner th').forEach(function(th){
    /* 跳过已有手柄的列 */
    if(th.querySelector('.resizer'))return;
    var div=document.createElement('div');
    div.className='resizer';
    th.appendChild(div);
    var startX=0,startW=0,resizing=0;
    div.addEventListener('mousedown',function(e){
      e.preventDefault();resizing=1;startX=e.clientX;startW=th.offsetWidth;
      document.body.style.cursor='col-resize';document.body.style.userSelect='none';
      document.addEventListener('mousemove',onMouseMove);
      document.addEventListener('mouseup',onMouseUp);
    });
    function onMouseMove(e){
      if(!resizing)return;
      var w=Math.max(40,startW+(e.clientX-startX));
      th.style.width=w+'px';th.style.maxWidth=w+'px';
      /* 同步同列 td */
      var colIdx=Array.from(th.parentNode.children).indexOf(th);
      document.querySelectorAll('#mainBody tr').forEach(function(tr){
        var td=tr.children[colIdx];if(td){td.style.width=w+'px';td.style.maxWidth=w+'px'}
      });
    }
    function onMouseUp(){
      resizing=0;document.body.style.cursor='';document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMouseMove);
      document.removeEventListener('mouseup',onMouseUp);
    }
  });
}
window.preview=function(url,name){
  document.getElementById('modalFileName').textContent=name;
  document.getElementById('modalBody').innerHTML='<iframe src="'+url+'" loading="lazy"></iframe><div class="modal-info"><strong>文件名：</strong>'+esc(name)+'<br><strong>预览：</strong><a href="'+url+'" target="_blank">'+url+'</a></div>';
  document.getElementById('previewModal').classList.add('show');
};
document.getElementById('modalClose').onclick=function(){document.getElementById('previewModal').classList.remove('show')};
document.getElementById('previewModal').onclick=function(e){if(e.target===this)this.classList.remove('show')};
function esc(t){if(!t)return '';var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function escapeAttr(t){if(!t)return '';return t.replace(/'/g,'%27').replace(/"/g,'%22')}
function escAttr(t){if(!t)return '';return t.replace(/['"]/g,'').replace(/&/g,'&amp;')}
document.getElementById('exportBtn').addEventListener('click',function(){
  var fks=window.activeFormKeys||[];
  var h=['序号'];
  COLUMNS.forEach(function(c){if(isColVis(c.key))h.push(c.label)});
  fks.forEach(function(k){if(isColVis('cf_'+k))h.push(k)});
  var rows=allProcesses.map(function(p,i){
    var r=[i+1];
    COLUMNS.forEach(function(c){
      if(!isColVis(c.key))return;
      if(c.key==='templateName')r.push(p.templateName);
      else if(c.key==='applicantName')r.push(p.applicantName||'');
      else if(c.key==='createTime')r.push((p.createTime||'').substring(0,10));
      else if(c.key==='title')r.push(p.title);
      else if(c.key==='processCode')r.push(p.processCode||p.processId||'');
      else if(c.key==='files')r.push(p.fileCount||0);
    });
    fks.forEach(function(k){if(isColVis('cf_'+k))r.push((p.formFields||{})[k]||'')});
    return r;
  });
  var csv=[h.join(',')].concat(rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')})).join('\n');
  var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='流程台账详情_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
});
document.getElementById('batchDlBtn').addEventListener('click',function(e){
  e.preventDefault();var btn=document.getElementById('batchDlBtn'),prog=document.getElementById('dlProgress');
  var todo=[];
  allProcesses.forEach(function(p){if(selectedKeys[procKey(p)])(p.files||[]).forEach(function(f){todo.push(f)})});
  if(!todo.length){prog.textContent='所选流程无文件可下载';return}
  btn.disabled=1;btn.textContent='打包中...';
  var zip=new JSZip(),total=todo.length,done=0,failed=0,nameCount={};
  function next(i){
    if(i>=total){
      prog.textContent='正在生成压缩包...';
      zip.generateAsync({type:'blob'}).then(function(blob){
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='流程台账附件_'+new Date().toISOString().slice(0,10)+'.zip';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(a.href)},60000);
        prog.textContent='下载完成'+(failed?'（'+failed+'个失败）':'');prog.style.color='var(--green-500)';btn.textContent='批量下载';btn.disabled=0;
      });return;
    }
    var f=todo[i],url=f.officeFileUrl||f.fileUrl;
    if(!url){failed++;next(i+1);return}
    var bn=f.fileName||'文件_'+(i+1);
    if(!bn.includes('.')){var pm=url.match(/\/([^/?#]+?\.\w+)(?:$|[?#])/);if(pm)bn=decodeURIComponent(pm[1])}
    nameCount[bn]=(nameCount[bn]||0)+1;
    var zn=nameCount[bn]>1?bn.replace(/(\.\w+)?$/,'_'+nameCount[bn]+'$1'):bn,ne=!zn.includes('.');
    prog.textContent='正在下载 ('+(done+failed+1)+'/'+total+') '+bn;
    fetch(url,{mode:'cors',credentials:'omit'})
    .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);var ct=r.headers.get('content-type')||'';return r.blob().then(function(b){return{blob:b,contentType:ct}})})
    .then(function(r){
      if(ne){
        var em={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','image/bmp':'bmp','video/mp4':'mp4','video/x-msvideo':'avi','video/quicktime':'mov','video/x-matroska':'mkv','video/webm':'webm','audio/mpeg':'mp3','audio/wav':'wav','audio/ogg':'ogg','application/pdf':'pdf','application/msword':'doc','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx','application/vnd.ms-excel':'xls','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','application/vnd.ms-powerpoint':'ppt','application/vnd.openxmlformats-officedocument.presentationml.presentation':'pptx','application/zip':'zip','application/x-rar-compressed':'rar','text/plain':'txt','text/html':'html','text/csv':'csv','application/json':'json','application/xml':'xml'};
        var ext='';for(var ct in em){if(r.contentType.indexOf(ct)!==-1){ext=em[ct];break}}if(!ext)ext=f.fileType==='image'?'jpg':'bin';zn=zn+'.'+ext;
      }
      zip.file(zn,r.blob);done++;prog.textContent='已完成 '+done+'/'+total;next(i+1);
    })
    .catch(function(e){failed++;console.warn('下载失败:',url,e.message);prog.textContent='下载失败 '+failed+' 个 ('+(done+failed)+'/'+total+')';next(i+1)});
  }
  next(0);
});
</script>
