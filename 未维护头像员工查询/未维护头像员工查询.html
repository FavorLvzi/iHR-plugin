  <script>
    // ==============================
    //  请求封装（与司龄计算器一致）
    // ==============================
    var DEFAULT_HEADERS = {
      "x-requested-with": "XMLHttpRequest",
      "IHR-Request-Origin": "frontend_skill_page",
    };

    function generateRId() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 11);
    }

    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    function request(url, options) {
      options = options || {};
      var headers = options.headers || {};
      var credentials = options.credentials || "include";
      var restOptions = {};
      for (var k in options) {
        if (k !== 'headers' && k !== 'credentials') restOptions[k] = options[k];
      }
      var separator = url.indexOf("?") !== -1 ? "&" : "?";
      var urlWithRId = url + separator + "r_id=" + generateRId();
      var xsrfToken = getCookie("XSRF-TOKEN") || getCookie("xsrf-token");

      return fetch(urlWithRId, {
        credentials: credentials,
        headers: Object.assign({}, DEFAULT_HEADERS,
          xsrfToken ? { "x-xsrf-token": xsrfToken } : {},
          headers),
        method: restOptions.method,
        body: restOptions.body,
      });
    }

    // ==============================
    //  工具函数
    // ==============================
    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function fmtDateStr(raw) {
      if (!raw) return '-';
      if (typeof raw === 'number') {
        var d = new Date(raw);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }
      if (typeof raw === 'string' && raw.indexOf('-') !== -1) {
        var p = raw.split('-');
        if (p.length >= 3) return raw.substring(0, 10);
      }
      return raw;
    }

    // ==============================
    //  数据 & 分页状态
    // ==============================
    var allResults = [];        // 所有无头像员工
    var filteredResults = [];
    var pageSize = parseInt(localStorage.getItem('avatarPageSize')) || 25;
    document.getElementById('pageSizeSelect').value = pageSize;
    document.getElementById('pageSizeSelect').addEventListener('change', function() {
      pageSize = parseInt(this.value);
      try { localStorage.setItem('avatarPageSize', pageSize); } catch(e) {}
      currentPage = 1;
      renderPage();
    });
    var currentPage = 1;
    var totalStaffCount = 0;   // 在职总数

    // ==============================
    //  加载动画 & 进度
    // ==============================
    function setLoadingState(visible) {
      document.getElementById('loadingCard').style.display = visible ? 'block' : 'none';
    }

    function updateLoadingUI(page, totalPages, label, dataCount) {
      var pct = totalPages > 0 ? Math.round(page / totalPages * 100) : 0;
      var fill = document.getElementById('progressFill');
      if (totalPages > 0) {
        fill.style.width = pct + '%';
        fill.classList.remove('indeterminate');
      } else {
        fill.classList.add('indeterminate');
      }
      var statusText = totalPages > 0
        ? label + ' 第 ' + page + '/' + totalPages + ' 页'
        : label + ' 获取中...';
      document.getElementById('loadingStatus').textContent = statusText;
      document.getElementById('loadingDetail').textContent = dataCount > 0 ? '已扫描 ' + dataCount + ' 条记录' : '';
      var titleText;
      if (totalPages === 0) {
        titleText = '正在连接服务器...';
      } else if (pct < 25) {
        titleText = '小喵正在努力拉取数据...';
      } else if (pct < 50) {
        titleText = '数据有点多，请耐心等待~';
      } else if (pct < 80) {
        titleText = '快了快了，小喵加油中...';
      } else {
        titleText = '马上就好，正在整理数据...';
      }
      document.getElementById('loadingTitle').textContent = titleText;
    }

    // ==============================
    //  查询主逻辑
    // ==============================
    var isLoading = false;

    document.getElementById('queryBtn').addEventListener('click', function() {
      if (isLoading) return;
      isLoading = true;
      var btn = document.getElementById('queryBtn');
      btn.disabled = true;
      btn.textContent = '查询中...';

      // 重置状态
      allResults = [];
      filteredResults = [];
      totalStaffCount = 0;
      document.getElementById('statsRow').style.display = 'none';
      document.getElementById('errorCard').style.display = 'none';
      document.getElementById('filterBar').style.display = 'none';
      document.getElementById('exportBtn').disabled = true;
      document.getElementById('mainBody').innerHTML = '<tr><td colspan="4" class="empty-state">查询中...</td></tr>';
      document.getElementById('pager').style.display = 'none';
      document.getElementById('sourceLabel').innerHTML = '<span class="status-dot empty"></span>查询中...';

      // 加载动画
      setLoadingState(true);
      var fillEl = document.getElementById('progressFill');
      fillEl.style.width = '0%';
      fillEl.classList.add('indeterminate');
      updateLoadingUI(0, 0, '在职员工', 0);

      doQuery().then(function() {
        applyFilter();
        setLoadingState(false);
        document.getElementById('sourceLabel').innerHTML =
          '<span class="status-dot live"></span>真实数据（' + allResults.length + ' 人无头像）';
      }).catch(function(err) {
        setLoadingState(false);
        document.getElementById('errorCard').style.display = 'block';
        document.getElementById('errorMsg').textContent = '查询失败: ' + err.message;
        document.getElementById('mainBody').innerHTML = '<tr><td colspan="4" class="empty-state">查询出错，请重试</td></tr>';
      }).finally(function() {
        isLoading = false;
        btn.disabled = false;
        btn.textContent = '查询真实数据';
      });
    });

    async function doQuery() {
      var page = 1;
      var pageSizeVal = 100;
      var hasMore = true;

      while (hasMore) {
        updateLoadingUI(page, 0, '在职员工', totalStaffCount);

        var response = await request("/web/gateway/roster/aggregate/v1/staffs/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fields: ["staffName", "mobileNo", "staffImageId", "departmentName", "enrollInDate", "staffStatus"],
            page: page,
            pageSize: String(pageSizeVal),
            flexSearchItems: [
              { fieldType: "EQUAL", searchKey: "staffStatus", searchParam: "IN_SERVICE" }
            ],
          }),
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        var result = await response.json();

        if (result.code !== 0) {
          throw new Error(result.message || "code=" + result.code);
        }

        var staffList = result.data.list || [];
        totalStaffCount = result.data.totalElements || 0;
        var totalPages = result.data.totalPages || 0;

        // 筛选无头像员工
        for (var i = 0; i < staffList.length; i++) {
          if (!staffList[i].staffImageId) {
            allResults.push(staffList[i]);
          }
        }

        updateLoadingUI(page, totalPages, '在职员工', totalStaffCount);

        if (page >= totalPages) {
          hasMore = false;
        } else {
          page++;
        }
      }

      // 更新统计
      document.getElementById('statNoAvatar').textContent = allResults.length;
      document.getElementById('statTotal').textContent = totalStaffCount;
      var coverage = totalStaffCount > 0
        ? ((totalStaffCount - allResults.length) / totalStaffCount * 100).toFixed(1) + '%'
        : '-';
      document.getElementById('statCoverage').textContent = coverage;
      document.getElementById('statTime').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
      document.getElementById('statsRow').style.display = 'grid';
      document.getElementById('filterBar').style.display = 'flex';
      document.getElementById('exportBtn').disabled = allResults.length === 0;
    }

    // ==============================
    //  搜索过滤
    // ==============================
    function applyFilter() {
      var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      var dept = (document.getElementById('deptInput').value || '').toLowerCase().trim();

      filteredResults = allResults.filter(function(staff) {
        if (search && (staff.staffName || '').toLowerCase().indexOf(search) === -1) return false;
        if (dept && (staff.departmentName || '').toLowerCase().indexOf(dept) === -1) return false;
        return true;
      });

      currentPage = 1;
      renderPage();
      rebuildHeader();
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      currentPage = 1;
      applyFilter();
    });
    document.getElementById('deptInput').addEventListener('input', function() {
      currentPage = 1;
      applyFilter();
    });

    // ==============================
    //  分页渲染
    // ==============================
    function renderPage() {
      var totalPages = Math.ceil(filteredResults.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * pageSize;
      var pageRows = filteredResults.slice(start, start + pageSize);
      var startNum = filteredResults.length === 0 ? 0 : start + 1;
      var endNum = Math.min(start + pageSize, filteredResults.length);

      document.getElementById('filterCount').textContent =
        '共 ' + filteredResults.length + ' 条（显示 ' + startNum + '-' + endNum + '）';

      var html = '';
      for (var i = 0; i < pageRows.length; i++) {
        var s = pageRows[i];
        html += '<tr>';
        COLUMNS_DEF.forEach(function(c){
          if(!isColVis(c.key))return;
          if(c.key==='staffName')html+='<td>'+escapeHtml(s.staffName||'-')+'</td>';
          else if(c.key==='mobileNo')html+='<td>'+escapeHtml(s.mobileNo||'-')+'</td>';
          else if(c.key==='departmentName')html+='<td>'+escapeHtml(s.departmentName||'-')+'</td>';
          else if(c.key==='enrollInDate')html+='<td>'+fmtDateStr(s.enrollInDate)+'</td>';
        });
        html+='</tr>';
      }

      if (filteredResults.length === 0) {
        html = '<tr><td colspan="4" class="empty-state">' +
          (allResults.length > 0 ? '无匹配数据，请调整搜索条件' : '所有员工均已维护头像') +
          '</td></tr>';
      }

      document.getElementById('mainBody').innerHTML = html;
      renderPager(totalPages);
      initColResize();
      buildSettingsPop();
    }

    function renderPager(totalPages) {
      if (totalPages <= 1) {
        document.getElementById('pager').style.display = 'none';
        return;
      }
      document.getElementById('pager').style.display = 'flex';

      var html = '';
      html += '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' id="prevBtn">上一页</button>';

      var showPages = [];
      for (var p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
          showPages.push(p);
        } else if (showPages.length > 0 && showPages[showPages.length - 1] !== '...') {
          showPages.push('...');
        }
      }

      for (var i = 0; i < showPages.length; i++) {
        var page = showPages[i];
        if (page === '...') {
          html += '<span class="page-info">...</span>';
        } else {
          html += '<button class="' + (page === currentPage ? 'active' : '') + '" data-page="' + page + '">' + page + '</button>';
        }
      }

      html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' id="nextBtn">下一页</button>';
      html += '<span class="page-info">共 ' + totalPages + ' 页</span>';

      document.getElementById('pager').innerHTML = html;

      document.getElementById('prevBtn').addEventListener('click', function() {
        if (currentPage > 1) { currentPage--; renderPage(); }
      });
      document.getElementById('nextBtn').addEventListener('click', function() {
        if (currentPage < totalPages) { currentPage++; renderPage(); }
      });
      var pageBtns = document.getElementById('pager').querySelectorAll('[data-page]');
      for (var j = 0; j < pageBtns.length; j++) {
        pageBtns[j].addEventListener('click', function() {
          currentPage = +this.getAttribute('data-page');
          renderPage();
        });
      }
    }

    // ==============================
    //  CSV 导出
    // ==============================
    document.getElementById('exportBtn').addEventListener('click', function() {
      if (allResults.length === 0) return;

      var headers = ['序号', '员工姓名', '手机号', '部门', '入职日期'];
      var rows = allResults.map(function(staff, index) {
        return [
          index + 1,
          staff.staffName || '',
          staff.mobileNo || '',
          staff.departmentName || '',
          fmtDateStr(staff.enrollInDate),
        ];
      });

      var csvContent = [
        headers.join(','),
      ].concat(rows.map(function(row) {
        return row.map(function(cell) {
          return '"' + String(cell).replace(/"/g, '""') + '"';
        }).join(',');
      })).join('\n');

      var blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '未维护头像员工_' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    /* ---- 小齿轮设置弹窗 ---- */
    var COLUMNS_DEF = [
      {key:'staffName', label:'员工姓名', defShow:1},
      {key:'mobileNo', label:'手机号', defShow:1},
      {key:'departmentName', label:'部门', defShow:1},
      {key:'enrollInDate', label:'入职日期', defShow:1},
    ];
    function loadColVis(){
      var s;try{s=JSON.parse(localStorage.getItem('avatarColVis'))}catch(e){}
      window.colVis=s||{};
      COLUMNS_DEF.forEach(function(c){if(window.colVis[c.key]===undefined)window.colVis[c.key]=c.defShow});
    }
    function saveColVis(){
      try{localStorage.setItem('avatarColVis',JSON.stringify(window.colVis))}catch(e){}
      renderPage();
    }
    function isColVis(k){return window.colVis[k]!==0}
    loadColVis();
    function buildSettingsPop(){
      var h='<div class="sttl">显示列</div>';
      COLUMNS_DEF.forEach(function(c){
        var ch=isColVis(c.key)?'checked':'';
        h+='<label><input type="checkbox" data-col="'+c.key+'" '+ch+'>'+c.label+'</label>';
      });
      document.getElementById('settingsPop').innerHTML=h;
      document.querySelectorAll('#settingsPop input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change',function(){
          window.colVis[this.getAttribute('data-col')]=this.checked?1:0;
          saveColVis();
        });
      });
    }
    /* 齿轮点击 */
    document.getElementById('settingsBtn').addEventListener('click',function(e){
      e.stopPropagation();document.getElementById('settingsPop').classList.toggle('show');
    });
    document.addEventListener('click',function(){document.getElementById('settingsPop').classList.remove('show')});
    document.getElementById('settingsPop').addEventListener('click',function(e){e.stopPropagation()});

    /* ---- 表头拖拽 ---- */
    function initColResize(){
      document.querySelectorAll('#theadInner th').forEach(function(th){
        if(th.querySelector('.resizer'))return;
        var div=document.createElement('div');div.className='resizer';th.appendChild(div);
        var sx=0,sw=0,rz=0;
        div.addEventListener('mousedown',function(e){
          e.preventDefault();rz=1;sx=e.clientX;sw=th.offsetWidth;
          document.body.style.cursor='col-resize';document.body.style.userSelect='none';
          document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
        });
        function onMove(e){if(!rz)return;var w=Math.max(40,sw+(e.clientX-sx));th.style.width=w+'px';th.style.maxWidth=w+'px';var ci=Array.from(th.parentNode.children).indexOf(th);document.querySelectorAll('#mainBody tr').forEach(function(tr){var td=tr.children[ci];if(td){td.style.width=w+'px';td.style.maxWidth=w+'px'}});}
        function onUp(){rz=0;document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
      });
    }

    /* ---- 重建表头 ---- */
    function rebuildHeader(){
      var h='<tr>';
      COLUMNS_DEF.forEach(function(c){if(isColVis(c.key))h+='<th>'+c.label+'</th>'});
      h+='</tr>';
      document.getElementById('theadInner').innerHTML=h;
    }
  </script>
</body>
</html>
