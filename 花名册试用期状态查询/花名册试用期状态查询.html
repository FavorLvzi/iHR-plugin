<body>

  <script>
    // ==============================
    //  常量
    // ==============================
    var STAFF_TYPE_MAP = {
      "FULLTIME": "全职", "PARTTIME": "兼职", "INTERSHIP": "实习",
      "EXPATRIATE": "外派", "TEMPORARY": "临时工", "REHIRE_RETIREMENT": "退休返聘"
    };
    var TABS = ["all", "probation", "near", "regular", "unset"];

    // ==============================
    //  工具函数
    // ==============================
    function parseDate(s) {
      if (!s && s !== 0) return null;
      if (typeof s === 'number' || (typeof s === 'string' && /^\d+$/.test(s))) {
        var d = new Date(+s); return isNaN(d.getTime()) ? null : d;
      }
      if (typeof s === 'string' && s.indexOf('-') !== -1) {
        var p = s.split('-');
        var d2 = new Date(+p[0], +p[1] - 1, +p[2]);
        return isNaN(d2.getTime()) ? null : d2;
      }
      return null;
    }
    function fmtDate(d) { if (!d) return '-'; return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function todayDate() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function diffDays(d1, d2) { return Math.round((d2 - d1) / 86400000); }
    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div'); div.textContent = String(text); return div.innerHTML;
    }

    // ==============================
    //  请求封装（参考司龄计算）
    // ==============================
    var DEFAULT_HEADERS = {
      "x-requested-with": "XMLHttpRequest",
      "IHR-Request-Origin": "frontend_skill_page",
    };
    function generateRId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 11); }
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }
    function request(url, options) {
      options = options || {};
      var headers = options.headers || {};
      var credentials = options.credentials || "include";
      var restOptions = {};
      for (var k in options) {
        if (k !== 'headers' && k !== 'credentials') restOptions[k] = options[k];
      }
      var separator = url.indexOf("?") !== -1 ? "&" : "?";
      var urlWithRId = url + separator + "r_id=" + generateRId();
      var xsrfToken = getCookie("XSRF-TOKEN") || getCookie("xsrf-token");
      return fetch(urlWithRId, {
        credentials: credentials,
        headers: Object.assign({}, DEFAULT_HEADERS, xsrfToken ? {"x-xsrf-token": xsrfToken} : {}, headers),
        method: restOptions.method,
        body: restOptions.body,
      });
    }

    // ==============================
    //  数据状态
    // ==============================
    var allStaff = [];
    var filteredStaff = [];
    var currentTab = "all";
    var pageSize = parseInt(localStorage.getItem('probationPageSize')) || 25;
    document.getElementById('pageSizeSelect').value = pageSize;
    document.getElementById('pageSizeSelect').addEventListener('change', function() {
      pageSize = parseInt(this.value);
      try { localStorage.setItem('probationPageSize', pageSize); } catch(e) {}
      currentPage = 1;
      renderPage();
    });
    var currentPage = 1;
    var isLoading = false;

    // ==============================
    //  查询主流程（参考司龄计算 async/await + while）
    // ==============================
    document.getElementById('queryBtn').addEventListener('click', function() {
      if (isLoading) return;
      isLoading = true;
      var btn = document.getElementById('queryBtn');
      btn.disabled = true; btn.textContent = '查询中...';

      // 显示加载
      document.getElementById('loadingCard').style.display = 'block';
      document.getElementById('statsRow').style.display = 'none';
      document.getElementById('dataCard').style.display = 'none';
      document.getElementById('loadingTitle').textContent = '正在连接服务器...';
      document.getElementById('loadingStatus').textContent = '准备中...';
      document.getElementById('loadingDetail').textContent = '';
      var fill = document.getElementById('progressFill');
      fill.style.width = '0%'; fill.classList.remove('indeterminate'); fill.classList.add('active');

      doQuery().then(function() {
        rebuildHeader();
        updateStats();
        buildDeptFilter();
        applyTab();
        document.getElementById('loadingCard').style.display = 'none';
        document.getElementById('statsRow').style.display = 'grid';
        document.getElementById('dataCard').style.display = 'block';
      }).catch(function(err) {
        document.getElementById('loadingCard').style.display = 'none';
        alert('查询失败: ' + err.message);
      }).finally(function() {
        isLoading = false; btn.disabled = false; btn.textContent = '查询真实数据';
      });
    });

    async function doQuery() {
      var fields = ["staffName", "staffNo", "departmentName", "positionName",
        "staffType", "enrollInDate", "probationStatus", "probationEndDate", "mobileNo"];
      var page = 1, hasMore = true;
      allStaff = [];

      while (hasMore) {
        updateLoading(page, 0);

        var response = await request("/web/gateway/roster/aggregate/v1/staffs/search", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            fields: fields,
            page: page,
            pageSize: "100",
            flexSearchItems: [
              {fieldType: "EQUAL", searchKey: "staffStatus", searchParam: "IN_SERVICE"}
            ]
          }),
        });

        if (!response.ok) throw new Error("HTTP " + response.status);
        var result = await response.json();
        if (result.code !== 0) throw new Error(result.message || "code=" + result.code);

        var list = result.data.list || [];
        for (var i = 0; i < list.length; i++) {
          var s = list[i];
          var probStatus = s.probationStatus || "";

          // 试用期分类：三种值 — PASSED(已转正), ONPROBATION(试用期), 空(未设置)
          var category;
          if (probStatus === "PASSED") category = "regular";
          else if (probStatus === "ONPROBATION" || s.isProbation === true) category = "probation";
          else if (probStatus) category = "probation";
          else category = "unset";

          // 是否即将转正（30天内）
          var isNear = false;
          if (category === "probation" && s.probationEndDate) {
            var ped = parseDate(s.probationEndDate);
            if (ped) {
              var td = todayDate();
              var remain = diffDays(td, ped);
              if (remain >= 0 && remain <= 30) isNear = true;
            }
          }

          allStaff.push({
            staffName: s.staffName || "",
            staffNo: s.staffNo || "",
            departmentName: s.departmentName || "",
            positionName: s.positionName || "",
            staffType: s.staffType || "",
            enrollInDate: s.enrollInDate || "",
            probationEndDate: s.probationEndDate || "",
            probationStatus: probStatus,
            category: category,
            isNear: isNear,
          });
        }

        var totalPages = result.data.totalPages || 0;
        updateLoading(page, totalPages);
        if (page >= totalPages) hasMore = false; else page++;
      }
    }

    function updateLoading(page, totalPages) {
      var statusEl = document.getElementById('loadingStatus');
      var detailEl = document.getElementById('loadingDetail');
      var fill = document.getElementById('progressFill');

      statusEl.textContent = '第 ' + page + '/' + (totalPages || '?') + ' 页';
      detailEl.textContent = allStaff.length > 0 ? '已获取 ' + allStaff.length + ' 条数据' : '';

      if (totalPages > 0) {
        fill.classList.remove('indeterminate');
        fill.style.width = Math.round(page / totalPages * 100) + '%';
      } else {
        fill.classList.add('indeterminate');
      }

      var pct = totalPages > 0 ? Math.round(page / totalPages * 100) : 0;
      document.getElementById('loadingTitle').textContent =
        pct < 25 ? '小喵正在努力拉取数据...' :
        pct < 50 ? '数据有点多，请耐心等待~' :
        pct < 80 ? '快了快了，小喵加油中...' : '马上就好，正在整理数据...';
    }

    // ==============================
    //  统计卡片 & 部门筛选
    // ==============================
    function updateStats() {
      var total = allStaff.length;
      var probation = 0, near = 0, regular = 0, unset = 0;
      for (var i = 0; i < allStaff.length; i++) {
        var c = allStaff[i].category;
        if (c === "regular") regular++;
        else if (c === "unset") unset++;
        else {
          probation++;
          if (allStaff[i].isNear) near++;
        }
      }
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statProbation').textContent = probation;
      document.getElementById('statNear').textContent = near;
      document.getElementById('statRegular').textContent = regular;
      document.getElementById('statUnset').textContent = unset;

      document.getElementById('badgeAll').textContent = total;
      document.getElementById('badgeProbation').textContent = probation;
      document.getElementById('badgeNear').textContent = near;
      document.getElementById('badgeRegular').textContent = regular;
      document.getElementById('badgeUnset').textContent = unset;
    }

    function buildDeptFilter() {
      var deptSet = {};
      for (var i = 0; i < allStaff.length; i++) {
        if (allStaff[i].departmentName) deptSet[allStaff[i].departmentName] = true;
      }
      var depts = Object.keys(deptSet).sort();
      var sel = document.getElementById('deptFilter');
      sel.innerHTML = '<option value="">全部部门</option>';
      for (var j = 0; j < depts.length; j++) {
        sel.innerHTML += '<option value="' + escapeHtml(depts[j]) + '">' + escapeHtml(depts[j]) + '</option>';
      }
    }

    // ==============================
    //  Tab 切换
    // ==============================
    document.getElementById('tabBar').addEventListener('click', function(e) {
      var tab = e.target.closest('.tab-item');
      if (!tab) return;
      var tabVal = tab.getAttribute('data-tab');
      if (tabVal === currentTab) return;
      currentTab = tabVal;
      applyTab();
    });

    function applyTab() {
      // 更新 tab 选中态
      var items = document.getElementById('tabBar').querySelectorAll('.tab-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('active', items[i].getAttribute('data-tab') === currentTab);
      }
      applyFilter();
    }

    // ==============================
    //  筛选
    // ==============================
    function applyFilter() {
      var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      var dept = document.getElementById('deptFilter').value;
      var staffType = document.getElementById('typeFilter').value;

      filteredStaff = allStaff.filter(function(s) {
        // Tab 筛选
        if (currentTab === "probation" && s.category !== "probation") return false;
        if (currentTab === "near" && !s.isNear) return false;
        if (currentTab === "regular" && s.category !== "regular") return false;
        if (currentTab === "unset" && s.category !== "unset") return false;

        // 关键词
        if (search) {
          var nameMatch = s.staffName.toLowerCase().indexOf(search) !== -1;
          var noMatch = s.staffNo.toLowerCase().indexOf(search) !== -1;
          if (!nameMatch && !noMatch) return false;
        }

        // 部门
        if (dept && s.departmentName !== dept) return false;

        // 员工类型
        if (staffType && s.staffType !== staffType) return false;

        return true;
      });

      currentPage = 1;
      renderPage();
    }

    document.getElementById('searchInput').addEventListener('input', function() { applyFilter(); });
    document.getElementById('deptFilter').addEventListener('change', function() { applyFilter(); });
    document.getElementById('typeFilter').addEventListener('change', function() { applyFilter(); });

    // ==============================
    //  渲染分页表格
    // ==============================
    function renderPage() {
      var totalPages = Math.ceil(filteredStaff.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * pageSize;
      var pageRows = filteredStaff.slice(start, start + pageSize);
      var startNum = filteredStaff.length === 0 ? 0 : start + 1;
      var endNum = Math.min(start + pageSize, filteredStaff.length);

      document.getElementById('filterCount').textContent =
        '共 ' + filteredStaff.length + ' 条（显示 ' + startNum + '-' + endNum + '）';

      var html = '';
      for (var i = 0; i < pageRows.length; i++) {
        var s = pageRows[i];
        var typeLabel = STAFF_TYPE_MAP[s.staffType] || s.staffType || '-';

        // 试用状态 badge
        var statusBadge;
        if (s.category === "regular") statusBadge = '<span class="badge badge-regular">已转正</span>';
        else if (s.category === "unset") statusBadge = '<span class="badge" style="background:#e5e7eb;color:#6b7280;">未设置</span>';
        else if (s.isNear) statusBadge = '<span class="badge badge-near">即将转正</span>';
        else statusBadge = '<span class="badge badge-probation">试用期</span>';

        html += '<tr>';
        COLUMNS_DEF.forEach(function(c){
          if(!isColVis(c.key))return;
          if(c.key==='staffName')html+='<td>'+escapeHtml(s.staffName)+'</td>';
          else if(c.key==='staffNo')html+='<td>'+escapeHtml(s.staffNo)+'</td>';
          else if(c.key==='departmentName')html+='<td>'+escapeHtml(s.departmentName)+'</td>';
          else if(c.key==='positionName')html+='<td>'+escapeHtml(s.positionName)+'</td>';
          else if(c.key==='staffType')html+='<td>'+escapeHtml(typeLabel)+'</td>';
          else if(c.key==='enrollInDate') {
            var ped = parseDate(s.enrollInDate);
            html+='<td>'+escapeHtml(ped ? fmtDate(ped) : (s.enrollInDate || '-'))+'</td>';
          }
          else if(c.key==='probationEndDate') {
            var pped = parseDate(s.probationEndDate);
            var dateStr = pped ? fmtDate(pped) : (s.probationEndDate || '-');
            var displayDate = s.isNear ? '⚠ ' + dateStr : dateStr;
            html+='<td>'+escapeHtml(displayDate)+'</td>';
          }
          else if(c.key==='probationStatus')html+='<td>'+statusBadge+'</td>';
        });
        html+='</tr>';
      }

      if (filteredStaff.length === 0) {
        html = '<tr><td colspan="'+COLUMNS_DEF.filter(function(c){return isColVis(c.key)}).length+'" class="empty-state">无匹配数据</td></tr>';
      }

      document.getElementById('mainBody').innerHTML = html;
      renderPager(totalPages);
      buildSettingsPop();
      initColResize();
    }

    function renderPager(totalPages) {
      var pager = document.getElementById('pager');
      if (totalPages <= 1) { pager.style.display = 'none'; return; }
      pager.style.display = 'flex';

      var html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' data-action="prev">上一页</button>';
      var showPages = [];
      for (var p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) showPages.push(p);
        else if (showPages.length > 0 && showPages[showPages.length - 1] !== '...') showPages.push('...');
      }
      for (var i = 0; i < showPages.length; i++) {
        if (showPages[i] === '...') html += '<span class="page-info">...</span>';
        else html += '<button class="' + (showPages[i] === currentPage ? 'active' : '') + '" data-action="page" data-page="' + showPages[i] + '">' + showPages[i] + '</button>';
      }
      html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' data-action="next">下一页</button>';
      html += '<span class="page-info">共 ' + totalPages + ' 页</span>';
      pager.innerHTML = html;
    }

    // 分页委托
    document.getElementById('pager').addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      var action = btn.getAttribute('data-action');
      if (action === 'prev') { currentPage--; renderPage(); }
      else if (action === 'next') { currentPage++; renderPage(); }
      else if (action === 'page') { currentPage = +btn.getAttribute('data-page'); renderPage(); }
    });

    /* ---- 列配置 ---- */
    var COLUMNS_DEF = [
      {key:'staffName', label:'姓名', defShow:1},
      {key:'staffNo', label:'工号', defShow:1},
      {key:'departmentName', label:'部门', defShow:1},
      {key:'positionName', label:'岗位', defShow:1},
      {key:'staffType', label:'员工类型', defShow:1},
      {key:'enrollInDate', label:'入职日期', defShow:1},
      {key:'probationEndDate', label:'试用期到期日', defShow:1},
      {key:'probationStatus', label:'试用状态', defShow:1},
    ];
    function loadColVis(){
      var s;try{s=JSON.parse(localStorage.getItem('probationColVis'))}catch(e){}
      window.colVis=s||{};
      COLUMNS_DEF.forEach(function(c){if(window.colVis[c.key]===undefined)window.colVis[c.key]=c.defShow});
    }
    function saveColVis(){
      try{localStorage.setItem('probationColVis',JSON.stringify(window.colVis))}catch(e){}
      renderPage();
    }
    function isColVis(k){return window.colVis[k]!==0}
    loadColVis();
    function buildSettingsPop(){
      var h='<div class="sttl">显示列</div>';
      COLUMNS_DEF.forEach(function(c){
        var ch=isColVis(c.key)?'checked':'';
        h+='<label><input type="checkbox" data-col="'+c.key+'" '+ch+'>'+c.label+'</label>';
      });
      document.getElementById('settingsPop').innerHTML=h;
      document.querySelectorAll('#settingsPop input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change',function(){
          window.colVis[this.getAttribute('data-col')]=this.checked?1:0;
          saveColVis();
        });
      });
    }
    document.getElementById('settingsBtn').addEventListener('click',function(e){
      e.stopPropagation();document.getElementById('settingsPop').classList.toggle('show');
    });
    document.addEventListener('click',function(){document.getElementById('settingsPop').classList.remove('show')});
    document.getElementById('settingsPop').addEventListener('click',function(e){e.stopPropagation()});
    function initColResize(){
      document.querySelectorAll('#mainTable thead th').forEach(function(th){
        if(th.querySelector('.resizer'))return;
        var div=document.createElement('div');div.className='resizer';th.appendChild(div);
        var sx=0,sw=0,rz=0;
        div.addEventListener('mousedown',function(e){
          e.preventDefault();rz=1;sx=e.clientX;sw=th.offsetWidth;
          document.body.style.cursor='col-resize';document.body.style.userSelect='none';
          document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
        });
        function onMove(e){if(!rz)return;var w=Math.max(40,sw+(e.clientX-sx));th.style.width=w+'px';th.style.maxWidth=w+'px';var ci=Array.from(th.parentNode.children).indexOf(th);document.querySelectorAll('#mainBody tr').forEach(function(tr){var td=tr.children[ci];if(td){td.style.width=w+'px';td.style.maxWidth=w+'px'}});}
        function onUp(){rz=0;document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
      });
    }
    function rebuildHeader(){
      var h='<tr>';
      COLUMNS_DEF.forEach(function(c){if(isColVis(c.key))h+='<th>'+c.label+'</th>'});
      h+='</tr>';
      document.getElementById('theadInner').innerHTML=h;
    }
  </script>
</body>
</html>
